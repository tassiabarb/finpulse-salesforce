<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2A0" />
      <stop offset="100%" stop-color="#0084FF" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D2A0" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="600" height="160" rx="16" fill="#FFFFFF"/>

  <!-- Icon Graphic -->
  <g transform="translate(40, 25)">
    <!-- Tech Hexagon / Shield Backdrop -->
    <path d="M55 5 L95 28 L95 78 L55 102 L15 78 L15 28 Z" fill="url(#shieldGrad)" />
    
    <!-- Dynamic Pulse Graph Line -->
    <path d="M 22 55 L 40 55 L 50 32 L 60 72 L 70 48 L 88 48" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glow)"/>
          
    <!-- Pulse Highlight Dot -->
    <circle cx="70" cy="48" r="4.5" fill="#00D2A0" />
  </g>

  <!-- Typography -->
  <text x="170" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="54" font-weight="800" fill="#0A2540" letter-spacing="-1">
    Fin<tspan fill="#00D2A0">Pulse</tspan>
  </text>
  
  <text x="172" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="3.5">
    FINANCIAL CLOUD CRM
  </text>
</svg>
