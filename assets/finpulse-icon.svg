<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <linearGradient id="pulseGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2A0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="shieldGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="glowIcon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#00D2A0" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="160" height="160" rx="36" fill="url(#shieldGradIcon)"/>

  <!-- Icon Graphic -->
  <g transform="translate(25, 25)">
    <!-- Hexagon border -->
    <path d="M55 8 L95 30 L95 80 L55 102 L15 80 L15 30 Z" fill="none" stroke="#334155" stroke-width="2.5" />
    
    <!-- Dynamic Pulse Graph Line -->
    <path d="M 22 55 L 40 55 L 50 30 L 60 75 L 70 48 L 88 48" 
          fill="none" 
          stroke="url(#pulseGradIcon)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          filter="url(#glowIcon)"/>
          
    <!-- Pulse Highlight Dot -->
    <circle cx="70" cy="48" r="5" fill="#00D2A0" />
  </g>
</svg>
